# listen_port configures the UDP port that the AURP server will listen on.
# Optional; defaults to 387 (the traditional AURP port).
# If you are operating behind a NAT, this can be any port you can forward to,
# but if jrouter is exposed directly to the internet, only 387 is expected to
# work.
listen_port: 387

# local_ip is used to set the "real" IP address that this server is
# reachable on, when it is not any of the host addresses.
# AURP includes this address as part of this server's identity in the network.
#
# (Say jrouter is running behind NAT, it won't know what the real publicly-
# routable address of the NAT gateway is unless you set this.)
#
# This is technically optional.
local_ip: 192.0.2.1

# monitoring_addr enables an inbuilt HTTP server that serves endpoints related
# to monitoring jrouter. Currently these are:
# - /status - a page that displays the current state of key components
# - /metrics - Prometheus-style metrics
monitoring_addr: ":9459"

# aurp configures AURP transport timing and optional Chapter 4 policies.
# update_interval is the routing-update interval. RFC 1504 requires at least
# 10 seconds; jrouter accepts whole 10-second units so Open-Rsp advertises the
# exact nominal update rate. Default: 10s.
# last_heard_from_timeout has an RFC minimum of 30s. If configured above 2m,
# jrouter sends the RFC tickle-before-data probe after two minutes without
# receiver-side activity.
aurp:
  update_interval: 10s
  last_heard_from_timeout: 90s
  retry_interval: 10s
  send_retry_limit: 5
  tickle_retry_limit: 10
  zone_info_retry_interval: 10s

  # Optional peer-scoped export hiding. hidden_networks remains available
  # when a range should be hidden from every AURP peer.
  #hidden_export_networks:
  #  - peer: cfg:remote.example
  #    start: 3000
  #    end: 3009

# ethertalk configures network interfaces used for Ethertalk, and the
# AppleTalk zone information.
# This can contain either a single ethertalk config, or a list of such configs.
ethertalk:
  # Name of the device - required.
  - device: en0

    # seed_mode controls whether this EtherTalk interface seeds the local
    # AppleTalk cable configuration.
    #   hard - seed immediately (historical jrouter behavior and default)
    #   soft - defer to an existing ZIP cable authority; become seed only
    #          after soft_seed_delay if none is discovered
    #   none - never act as the cable/zone seed authority
    seed_mode: hard

    # Only used with seed_mode: soft. Duration syntax is Go-style, such as
    # 30s, 1m, or 2m30s. Default: 30s.
    soft_seed_delay: 30s

    # ethernet_addr overrides the "hardware" address used by jrouter.
    # This may be useful if you have another AppleTalk software running on the
    # same machine, e.g. netatalk, and you do not want jrouter to steal its
    # packets.
    #ethernet_addr: '08:00:07:fe:dc:ba'

    # Name of the default AppleTalk zone - required.
    zone_name: The Twilight Zone

    # Extra zone names available in this network - optional.
    # Each node in the local network can be individually configured with either
    # the default above, or one of these. This can be used to make "widely
    # distributed" shared zones available without having to switch the whole
    # network over to it.
    extra_zones:
      - The Fright Zone
      - TimeZone
      - GlobalGaming

    # Network number range for this network (inclusive) - required.
    net_start: 100
    net_end: 100

# open_peering lets the server accept incoming connections from unknown servers.
# If you disable this, only the configured peers will be connected.
# For now I recommend enabling this.
open_peering: true

# peers lists IP addresses or domain names of peers to actively connect to.
# It is optional if you use peerlist_url (below).
peers:
  - 192.0.2.1
  - example.net

# peerlist_url provides an address to download a plain-text file containing
# peers to actively connect to. It is pulled once on startup, so to get new
# peers added this way, you currently have to restart jrouter.
# It is optional if you use peers (above).
peerlist_url: http://example.com/peers.txt
