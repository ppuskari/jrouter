name: AURP Set-6 S6.1 Test Build

on:
  push:
    branches:
      - petar/aurp-set6-field-20260828
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libpcap headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Go format check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files requiring gofmt:"
            echo "$files"
            echo
            echo "=== gofmt diff ==="
            gofmt -d $files
            exit 1
          fi
      - name: Unit tests
        run: go test ./...
      - name: Race tests for routing packages
        run: go test -race ./router ./aurp
      - name: Build all packages
        run: go build ./...
      - name: Build Linux amd64 S6.1 binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/jrouter-set6-s61-linux-amd64 .
          sha256sum dist/jrouter-set6-s61-linux-amd64 | tee dist/jrouter-set6-s61-linux-amd64.sha256
      - name: Upload Linux amd64 S6.1 binary
        uses: actions/upload-artifact@v4
        with:
          name: jrouter-set6-s61-linux-amd64
          path: |
            dist/jrouter-set6-s61-linux-amd64
            dist/jrouter-set6-s61-linux-amd64.sha256
          if-no-files-found: error
