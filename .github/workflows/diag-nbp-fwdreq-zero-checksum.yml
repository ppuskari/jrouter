name: NBP FwdReq zero-checksum diagnostic

on:
  push:
    branches:
      - diag/nbp-fwdreq-zero-checksum-gha-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install libpcap headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Global gofmt gate
        shell: bash
        run: |
          mapfile -t gofiles < <(git ls-files '*.go')
          files="$(gofmt -l "${gofiles[@]}")"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...

  windows-amd64:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Prove Windows interface to Npcap mapping
        shell: pwsh
        run: go test -v . -run TestPcapDeviceNameWindows
      - name: Prove EtherTalk node-zero broadcast semantics
        shell: pwsh
        run: go test -v ./router -run TestEtherTalkBroadcastNode
      - name: Prove AEP reply checksum reset
        shell: pwsh
        run: go test -v ./router -run TestPrepareAEPReplyClearsStaleChecksum
      - name: Build Windows amd64 diagnostic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $BuildSHA = '${{ github.sha }}'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -ldflags "-X drjosh.dev/jrouter/meta.Build=$BuildSHA" -o dist\jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe .
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows amd64 diagnostic build failed.'
          }
      - name: Verify executable identity
        shell: pwsh
        run: |
          $Actual = (& .\dist\jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe -version).Trim()
          $Actual | Set-Content -Encoding ascii .\dist\VERSION-WINDOWS-OUTPUT.txt
          if ($Actual -notmatch [regex]::Escape('${{ github.sha }}')) {
            throw "Version identity does not contain expected commit: $Actual"
          }
      - name: Generate SHA256
        shell: pwsh
        run: |
          $File = '.\dist\jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe'
          $Hash = (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe" |
            Set-Content -Encoding ascii .\dist\jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe.sha256
          Write-Host "SHA256: $Hash"
      - name: Upload Windows diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: jrouter-nbp-fwdreq-zero-checksum-diag-windows-amd64
          path: |
            dist/jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe
            dist/jrouter-v1.0.1-rc3-nbpcksumdiag-windows-amd64.exe.sha256
            dist/VERSION-WINDOWS-OUTPUT.txt
          if-no-files-found: error
