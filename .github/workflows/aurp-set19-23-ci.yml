name: AURP Sets 19-23 Follow-up

on:
  push:
    branches:
      - petar/aurp-set19-23-followup-20260829
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Global gofmt gate
        shell: bash
        run: |
          mapfile -t gofiles < <(git ls-files '*.go')
          if [ "${#gofiles[@]}" -eq 0 ]; then
            exit 0
          fi
          files="$(gofmt -l "${gofiles[@]}")"
          if [ -n "$files" ]; then
            echo "Tracked Go files requiring gofmt:"
            echo "$files"
            echo
            echo "=== gofmt diff ==="
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi

  test:
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libpcap headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./router ./aurp ./atalk/zip ./status
      - name: Follow-up stress x100
        run: go test ./router ./aurp ./atalk/zip -count=100
      - name: Build all packages
        run: go build ./...
      - name: Build Linux amd64 binary with exact commit identity
        shell: bash
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build             -ldflags "-X drjosh.dev/jrouter/meta.Build=${GITHUB_SHA}"             -o dist/jrouter-set23-linux-amd64 .
          sha256sum dist/jrouter-set23-linux-amd64             | tee dist/jrouter-set23-linux-amd64.sha256
      - name: Upload Linux amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: jrouter-set23-linux-amd64
          path: |
            dist/jrouter-set23-linux-amd64
            dist/jrouter-set23-linux-amd64.sha256
          if-no-files-found: error
