name: AURP Set27 Pre-RC Conformance

on:
  push:
    branches:
      - petar/aurp-set27-pre-rc-conformance-20260901
  pull_request:
    branches:
      - petar/aurp-set27-pre-rc-conformance-20260901
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurp-set27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Global gofmt gate
        shell: bash
        run: |
          mapfile -t gofiles < <(git ls-files '*.go')
          if [ "${#gofiles[@]}" -eq 0 ]; then
            exit 0
          fi
          files="$(gofmt -l "${gofiles[@]}")"
          if [ -n "$files" ]; then
            echo "Tracked Go files requiring gofmt:"
            echo "$files"
            echo
            echo "=== gofmt diff ==="
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi

  test:
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install libpcap headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Go vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./router ./aurp ./atalk/zip ./status
      - name: Phase2/AURP stress x100
        run: go test ./router ./aurp ./atalk/zip -count=100
      - name: Build all packages
        run: go build ./...
      - name: Build Linux amd64 binary with exact commit identity
        shell: bash
        run: |
          mkdir -p dist
          BUILD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X drjosh.dev/jrouter/meta.Build=${BUILD_SHA}" \
            -o dist/jrouter-set27-linux-amd64 .
          sha256sum dist/jrouter-set27-linux-amd64 \
            | tee dist/jrouter-set27-linux-amd64.sha256
      - name: Upload Linux amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: jrouter-set27-linux-amd64
          path: |
            dist/jrouter-set27-linux-amd64
            dist/jrouter-set27-linux-amd64.sha256
          if-no-files-found: error
